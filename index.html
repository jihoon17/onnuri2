<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>카카오맵 태블릿 터치 진단</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,"Malgun Gothic",sans-serif}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:auto;-webkit-user-select:none;user-select:none}
#panel{position:fixed;z-index:9999;top:10px;left:10px;right:10px;max-width:520px;padding:12px 14px;background:rgba(255,255,255,.94);border:1px solid #bbb;border-radius:12px;box-shadow:0 3px 14px rgba(0,0,0,.15);font-size:14px;line-height:1.5}
#status{font-weight:700;margin-bottom:5px}#log{font-size:12px;max-height:120px;overflow:auto;color:#333;white-space:pre-wrap}
#close{float:right;border:0;background:#222;color:#fff;border-radius:7px;padding:5px 9px}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel"><button id="close">패널 숨기기</button><div id="status">지도 준비 중…</div><div id="log"></div></div>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=01a0f8272692845e09fe8d4c402e6317&autoload=false"></script>
<script>
kakao.maps.load(function(){
  const mapEl=document.getElementById('map');
  const status=document.getElementById('status');
  const logEl=document.getElementById('log');
  const map=new kakao.maps.Map(mapEl,{center:new kakao.maps.LatLng(36.479934,127.286740),level:4,draggable:true,scrollwheel:true,disableDoubleClickZoom:false});
  map.setDraggable(true); map.setZoomable(true);
  function log(s){logEl.textContent=(s+'\n'+logEl.textContent).slice(0,1500)}
  function refresh(){status.textContent='draggable='+map.getDraggable()+' / zoomable='+map.getZoomable()}
  refresh(); log('Kakao Map 생성 완료');
  kakao.maps.event.addListener(map,'dragstart',()=>log('카카오 dragstart 발생'));
  kakao.maps.event.addListener(map,'drag',()=>log('카카오 drag 발생'));
  kakao.maps.event.addListener(map,'dragend',()=>log('카카오 dragend 발생'));
  kakao.maps.event.addListener(map,'center_changed',()=>refresh());
  ['pointerdown','pointermove','pointerup','touchstart','touchmove','touchend'].forEach(type=>{
    mapEl.addEventListener(type,e=>{
      const p=e.touches&&e.touches[0]||e;
      log(type+' x='+(p.clientX??'')+' y='+(p.clientY??''));
    },{capture:true,passive:true});
  });
  document.getElementById('close').onclick=()=>document.getElementById('panel').style.display='none';
});
</script>
</body>
</html>
