<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상점가 위치 검색 지도</title>
<style>
  :root{
    --primary: #3b6ea5;
    --primary-dark: #2b527d;
    --primary-light: #eaf1f8;
    --border: #c9d6e3;
    --ink: #1f2d3a;
    --muted: #5b6b7a;
    --bg: #f5f7fa;
    --white: #ffffff;
    --accent: #d97706;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .app {
    max-width: 640px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--white);
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 24px rgba(0,0,0,0.06);
  }

  /* 검색 영역 */
  .search-bar {
    display: flex;
    gap: 8px;
    padding: 14px;
    background: var(--white);
    border-bottom: 1px solid var(--border);
  }
  .search-bar input {
    flex: 1;
    padding: 12px 14px;
    font-size: 15px;
    border: 2px solid var(--ink);
    border-radius: 8px;
    outline: none;
  }
  .search-bar input:focus {
    border-color: var(--primary);
  }
  .search-bar button {
    padding: 0 22px;
    font-size: 15px;
    font-weight: 600;
    color: var(--white);
    background: var(--primary);
    border: 1px solid var(--primary-dark);
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  .search-bar button:hover { background: var(--primary-dark); }

  /* 검색 결과 헤더 */
  .result-header {
    background: var(--primary);
    color: var(--white);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 700;
    font-size: 15px;
  }
  .result-count-badge {
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }
  .result-list {
    max-height: 160px;
    overflow-y: auto;
    background: var(--primary-light);
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
  }
  .result-item {
    padding: 9px 16px;
    border-bottom: 1px solid #dbe6f0;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .result-item:hover { background: #dcebfa; }
  .result-item .r-market { font-weight: 600; color: var(--primary-dark); }
  .result-item .r-addr { color: var(--muted); }
  .result-empty {
    padding: 14px 16px;
    color: var(--muted);
    font-size: 13.5px;
  }

  /* 지도 영역 */
  .map-wrap {
    position: relative;
    flex: 1;
    min-height: 420px;
  }
  #map {
    width: 100%;
    height: 100%;
    min-height: 420px;
    background: #dfe7ee;
  }
  .map-fallback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    color: var(--muted);
    font-size: 13.5px;
    text-align: center;
    padding: 24px;
  }

  /* 지도를 볼 기준 (범례/뷰 옵션) */
  .view-criteria {
    background: var(--primary);
    color: var(--white);
    padding: 14px 16px;
  }
  .view-criteria .vc-title {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 10px;
  }
  .vc-options {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .vc-chip {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.45);
    color: var(--white);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12.5px;
    cursor: pointer;
  }
  .vc-chip.active {
    background: var(--white);
    color: var(--primary-dark);
    font-weight: 700;
  }
  .vc-legend {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
  }
  .vc-swatch {
    display: inline-block;
    width: 14px;
    height: 14px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.6);
  }
  .vc-note {
    margin-top: 10px;
    font-size: 12px;
    color: rgba(255,255,255,0.85);
  }
</style>
</head>
<body>
<div class="app">

  <!-- 주소/시장 검색 -->
  <div class="search-bar">
    <input id="searchInput" type="text" placeholder="주소 또는 시장(상점가) 입력" />
    <button id="searchBtn">검색</button>
  </div>

  <!-- 검색 결과 -->
  <div class="result-header">
    <span id="resultTitle">검색 결과</span>
    <span class="result-count-badge" id="alleyCountBadge">골목형상점가 0곳</span>
  </div>
  <div class="result-list" id="resultList">
    <div class="result-empty">골목형상점가 데이터를 불러오는 중입니다…</div>
  </div>

  <!-- 지도 영역 -->
  <div class="map-wrap">
    <div id="map"></div>
  </div>

  <!-- 지도를 볼 기준 (색상 범례) -->
  <div class="view-criteria">
    <div class="vc-title">지도를 볼 기준</div>
    <div class="vc-options">
      <span class="vc-legend"><i class="vc-swatch" style="background:#3b6ea5"></i>구역(전체 영역)</span>
      <span class="vc-legend"><i class="vc-swatch" style="background:#e02424"></i>검색된 특정 주소</span>
    </div>
    <div class="vc-note">주소·지번·상점 이름으로 검색하면 소속 구역은 파란색, 검색된 주소는 빨간색으로 표시됩니다.</div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  /* =========================================================
     카카오맵 앱키 설정
     -> https://developers.kakao.com 에서 발급받은
        JavaScript 키를 아래 KAKAO_APP_KEY 에 넣어주세요.
     ========================================================= */
  const KAKAO_APP_KEY = "01a0f8272692845e09fe8d4c402e6317";

  /* 엑셀 원본 파일 경로 (이 index.html과 같은 폴더/레포에 올려주세요) */
  const EXCEL_FILE_URL = "mapData_v1.xlsx";

  const COLOR_ZONE = "#3b6ea5";       // 구역(전체 영역) - 파란색
  const COLOR_HIGHLIGHT = "#e02424";  // 검색된 특정 주소 - 빨간색

  let map, geocoder;
  let MAP_DATA = { markets: [], parcels: [], zones: [] };
  let currentOverlays = []; // {polygon, marker}

  // ---------- 엑셀 원본 읽기 ----------
  async function loadExcelData(url) {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error("EXCEL_FETCH_FAIL");
    const buf = await resp.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array" });

    const overviewRows = XLSX.utils.sheet_to_json(wb.Sheets["시장개요"], { defval: "" });
    const addrRows = XLSX.utils.sheet_to_json(wb.Sheets["시장별주소"], { defval: "" });
    const zoneRows = XLSX.utils.sheet_to_json(wb.Sheets["구역"], { defval: "" });

    const markets = overviewRows.map(r => ({
      id: r["순번"],
      type: String(r["구분"]).trim(),
      name: String(r["명칭"]).trim()
    }));

    const parcels = addrRows.map(r => ({
      id: r["순번"],
      market: String(r["소속시장"]).trim(),
      address: String(r["주소"]).trim(),
      coords: JSON.parse(r["경계좌표"])
    }));

    const zones = zoneRows.map(r => ({
      id: r["순번"],
      market: String(r["소속시장"]).trim(),
      zoneNo: r["구역순번"],
      coords: JSON.parse(r["경계좌표"])
    }));

    return { markets, parcels, zones };
  }

  function loadKakaoSdk(appkey) {
    return new Promise((resolve, reject) => {
      if (!appkey || appkey.startsWith("여기에")) {
        reject(new Error("NO_KEY"));
        return;
      }
      const script = document.createElement("script");
      script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${appkey}&autoload=false&libraries=services`;
      script.onload = () => {
        kakao.maps.load(() => resolve());
      };
      script.onerror = () => reject(new Error("SDK_LOAD_FAIL"));
      document.head.appendChild(script);
    });
  }

  function initMap() {
    const container = document.getElementById("map");
    const defaultCenter = new kakao.maps.LatLng(36.4805, 127.2895); // 보람동 일대 중심
    map = new kakao.maps.Map(container, {
      center: defaultCenter,
      level: 5
    });
    geocoder = new kakao.maps.services.Geocoder();
  }

  function showFallback(message) {
    const wrap = document.querySelector(".map-wrap");
    const fallback = document.createElement("div");
    fallback.className = "map-fallback";
    fallback.innerHTML = `
      <div>🗺️ ${message}</div>
      <div>index.html 상단의 <code>KAKAO_APP_KEY</code> 값을<br>
      카카오 개발자센터에서 발급받은 JavaScript 키로 교체해주세요.</div>
    `;
    wrap.appendChild(fallback);
  }

  // ---------- 데이터 헬퍼 ----------
  function toLatLngPath(coords) {
    return coords.map(c => new kakao.maps.LatLng(c.lat, c.lng));
  }

  function clearOverlays() {
    currentOverlays.forEach(o => {
      if (o.polygon) o.polygon.setMap(null);
      if (o.marker) o.marker.setMap(null);
    });
    currentOverlays = [];
  }

  function getZonesForMarket(marketName) {
    return MAP_DATA.zones.filter(z => z.market === marketName);
  }

  function getMarketType(marketName) {
    const m = MAP_DATA.markets.find(m => m.name === marketName);
    return m ? m.type : null;
  }

  // 검색어와 매칭되는 필지(주소) 목록 (시장명 또는 주소 포함검색)
  function searchParcels(query) {
    const q = query.trim();
    if (!q) return [];
    return MAP_DATA.parcels.filter(p =>
      p.market.includes(q) || p.address.includes(q) || q.includes(p.market)
    );
  }

  function fitBoundsToPaths(paths) {
    if (!paths.length) return;
    const bounds = new kakao.maps.LatLngBounds();
    paths.forEach(path => path.forEach(ll => bounds.extend(ll)));
    map.setBounds(bounds);
  }

  function drawHighlightPolygon(parcel) {
    const path = toLatLngPath(parcel.coords);
    const polygon = new kakao.maps.Polygon({
      map,
      path,
      strokeWeight: 3,
      strokeColor: COLOR_HIGHLIGHT,
      strokeOpacity: 1,
      fillColor: COLOR_HIGHLIGHT,
      fillOpacity: 0.55,
      zIndex: 10
    });
    currentOverlays.push({ polygon });
    return path;
  }

  function drawZonePolygon(zone) {
    const path = toLatLngPath(zone.coords);
    const polygon = new kakao.maps.Polygon({
      map,
      path,
      strokeWeight: 2,
      strokeColor: COLOR_ZONE,
      strokeOpacity: 0.9,
      fillColor: COLOR_ZONE,
      fillOpacity: 0.4,
      zIndex: 1
    });
    currentOverlays.push({ polygon });
    return path;
  }

  function renderResultList(parcels) {
    const list = document.getElementById("resultList");
    const title = document.getElementById("resultTitle");
    const badge = document.getElementById("alleyCountBadge");

    if (!parcels.length) {
      list.innerHTML = `<div class="result-empty">일치하는 결과가 없습니다. 시장명(예: 보람동 호려울) 또는 지번 주소로 검색해보세요.</div>`;
      title.textContent = "검색 결과";
      badge.textContent = "골목형상점가 0곳";
      return;
    }

    title.textContent = `검색 결과 (${parcels.length}건)`;

    // 매칭된 결과에 포함된 시장 중 '골목형상점가' 유형만 개수 카운트
    const matchedMarkets = [...new Set(parcels.map(p => p.market))];
    const alleyCount = matchedMarkets.filter(
      m => getMarketType(m) === "골목형상점가"
    ).length;
    badge.textContent = `골목형상점가 ${alleyCount}곳`;

    list.innerHTML = parcels.map(p => `
      <div class="result-item" data-market="${p.market}" data-id="${p.id}">
        <span class="r-market">${p.market}</span>
        <span class="r-addr">${p.address}</span>
      </div>
    `).join("");

    list.querySelectorAll(".result-item").forEach(el => {
      el.addEventListener("click", () => {
        const id = Number(el.dataset.id);
        const parcel = MAP_DATA.parcels.find(p => p.id === id);
        if (parcel) focusOnParcels([parcel]);
      });
    });
  }

  // 초기 로딩 시: 골목형상점가 전체 구역도를 지도에 표시
  function showInitialAlleyZones() {
    const alleyMarkets = MAP_DATA.markets.filter(m => m.type === "골목형상점가");

    clearOverlays();
    const allPaths = [];
    alleyMarkets.forEach(m => {
      getZonesForMarket(m.name).forEach(z => allPaths.push(drawZonePolygon(z)));
    });
    fitBoundsToPaths(allPaths);

    // 결과 패널: 전체 골목형상점가 목록으로 초기 표시
    const title = document.getElementById("resultTitle");
    const badge = document.getElementById("alleyCountBadge");
    const list = document.getElementById("resultList");

    title.textContent = "골목형상점가 전체 구역도";
    badge.textContent = `골목형상점가 ${alleyMarkets.length}곳`;

    if (!alleyMarkets.length) {
      list.innerHTML = `<div class="result-empty">표시할 골목형상점가 데이터가 없습니다.</div>`;
      return;
    }

    list.innerHTML = alleyMarkets.map(m => {
      const zoneCount = getZonesForMarket(m.name).length;
      return `
        <div class="result-item" data-market="${m.name}">
          <span class="r-market">${m.name}</span>
          <span class="r-addr">구역 ${zoneCount}개</span>
        </div>
      `;
    }).join("");

    list.querySelectorAll(".result-item").forEach(el => {
      el.addEventListener("click", () => {
        const marketName = el.dataset.market;
        const relatedParcels = MAP_DATA.parcels.filter(p => p.market === marketName);
        if (relatedParcels.length) focusOnParcels(relatedParcels);
      });
    });
  }

  // 검색된 주소(들)의 소속 구역을 파란색으로, 검색된 주소 자체는 빨간색으로 겹쳐서 표시
  function focusOnParcels(parcels) {
    clearOverlays();
    const allPaths = [];

    // 1) 배경: 소속 구역 전체를 파란색으로 표시
    const markets = [...new Set(parcels.map(p => p.market))];
    markets.forEach(m => {
      getZonesForMarket(m).forEach(z => allPaths.push(drawZonePolygon(z)));
    });

    // 2) 강조: 검색으로 찾은 특정 주소(필지)를 빨간색으로 표시
    parcels.forEach(p => allPaths.push(drawHighlightPolygon(p)));

    fitBoundsToPaths(allPaths);
  }

  function geocodeFallbackSearch(query) {
    if (!geocoder) return;
    geocoder.addressSearch(query, (result, status) => {
      if (status === kakao.maps.services.Status.OK && result[0]) {
        const coords = new kakao.maps.LatLng(result[0].y, result[0].x);
        clearOverlays();
        map.setCenter(coords);
        map.setLevel(4);
        const marker = new kakao.maps.Marker({ map, position: coords });
        currentOverlays.push({ marker });

        const list = document.getElementById("resultList");
        list.innerHTML = `<div class="result-empty">등록된 상점가 데이터에는 없는 주소입니다. 입력하신 주소 위치로 지도를 이동했습니다.</div>`;
        document.getElementById("resultTitle").textContent = "검색 결과";
        document.getElementById("alleyCountBadge").textContent = "골목형상점가 0곳";
      } else {
        const list = document.getElementById("resultList");
        list.innerHTML = `<div class="result-empty">검색 결과가 없습니다. 시장명 또는 정확한 주소를 입력해주세요.</div>`;
        document.getElementById("resultTitle").textContent = "검색 결과";
        document.getElementById("alleyCountBadge").textContent = "골목형상점가 0곳";
      }
    });
  }

  function handleSearch() {
    const query = document.getElementById("searchInput").value;
    if (!query.trim()) return;

    const matched = searchParcels(query);
    renderResultList(matched);

    if (matched.length) {
      focusOnParcels(matched);
    } else if (map) {
      geocodeFallbackSearch(query);
    }
  }

  document.getElementById("searchBtn").addEventListener("click", handleSearch);
  document.getElementById("searchInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") handleSearch();
  });

  // ---------- 초기화 ----------
  Promise.all([loadKakaoSdk(KAKAO_APP_KEY), loadExcelData(EXCEL_FILE_URL)])
    .then(([_, data]) => {
      MAP_DATA = data;
      initMap();
      showInitialAlleyZones();
    })
    .catch((err) => {
      if (err.message === "NO_KEY") {
        showFallback("카카오 지도 API 키가 설정되지 않았습니다.");
      } else if (err.message === "EXCEL_FETCH_FAIL") {
        showFallback(`엑셀 데이터 파일(${EXCEL_FILE_URL})을 불러오지 못했습니다. index.html과 같은 위치에 파일이 있는지 확인해주세요.`);
      } else {
        showFallback("카카오 지도를 불러오지 못했습니다.");
      }
    });
</script>
</body>
</html>
