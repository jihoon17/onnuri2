<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상점가 위치 검색 지도</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- 왼쪽(모바일에서는 위쪽): 검색 / 결과 -->
  <div class="side-panel">

    <!-- 주소 검색 -->
    <div class="search-bar">
      <div class="search-input-wrap">
        <input id="searchInput" type="text" placeholder="주소 입력" autocomplete="off" />
        <button id="micBtn" class="mic-btn" type="button" title="음성으로 검색" aria-label="음성으로 검색">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path fill="currentColor" d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
      </div>
      <button id="searchBtn">검색</button>
      <button id="resetBtn" class="reset-btn">초기화</button>
    </div>

    <!-- 검색 결과 -->
    <div class="result-header">
      <span id="resultTitle">검색 결과</span>
      <span class="result-count-badge" id="alleyCountBadge">골목형상점가 0곳</span>
    </div>
    <div class="result-list" id="resultList">
      <div class="result-empty">골목형상점가 데이터를 불러오는 중입니다…</div>
    </div>
  </div>

  <!-- 오른쪽(모바일에서는 아래쪽): 지도 -->
  <div class="map-panel">
    <div class="map-wrap">
      <div id="map"></div>
    </div>

    <!-- 지도를 볼 기준 (유형별 클릭 필터) -->
    <div class="view-criteria">
      <div class="vc-title">지도를 볼 기준</div>
      <div class="vc-options" id="typeFilterOptions">
        <button type="button" class="type-chip active" data-type="전통시장" style="--chip-color:#f5c518">전통시장</button>
        <button type="button" class="type-chip active" data-type="상점가" style="--chip-color:#3fae5a">상점가</button>
        <button type="button" class="type-chip active" data-type="골목형상점가" style="--chip-color:#3b82f6">골목형상점가</button>
      </div>
      <div class="vc-legend-row">
        <span class="vc-legend"><i class="vc-swatch" style="background:#e02424"></i>검색된 특정 주소</span>
      </div>
      <div class="vc-note">유형 버튼을 클릭해서 켜고 끌 수 있습니다. 상점가 라벨을 클릭하면 그 구역만 진하게 강조되고(같은 유형 색의 진한 톤), 나머지 구역은 옅어지지 않고 그대로 유지됩니다. 주소·지번·상점 이름으로 검색하면 검색된 주소만 빨간색으로 강조됩니다.</div>
    </div>
  </div>

</div>

<!-- 엑셀 파싱 라이브러리 (SheetJS) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- 기능 로직 -->
<script src="app.js"></script>
</body>
</html>
