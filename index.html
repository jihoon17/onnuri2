<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상점가 위치 검색 지도</title>
<!-- v20260926b -->
<link rel="stylesheet" href="style.css?v=20260926b">
<style>
  /* ===== 강제 오버라이드 v20260926b ===== */
  .panel-toggle-text { display: none !important; }
  .panel-toggle {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    background: #fff !important;
    border: 1px solid rgba(0,0,0,0.14) !important;
    box-shadow: 0 1px 5px rgba(0,0,0,0.14) !important;
    padding: 0 !important;
    cursor: pointer !important;
  }
  /* 모바일 화살표: 지도 위 오버레이 — ▲/▼ 모두 배경 없이 양옆 지도 노출 */
  button.panel-toggle.panel-toggle--bottom {
    position: absolute !important;
    top: 0 !important;
    left: 50% !important;
    transform: translateX(-50%) !important;
    z-index: 36 !important;
    width: 44px !important;
    height: 28px !important;
    margin: 0 !important;
    border-radius: 0 !important;
    border: none !important;
    background: transparent !important;
    background-color: transparent !important;
    box-shadow: none !important;
  }
  button.panel-toggle.panel-toggle--bottom:hover,
  button.panel-toggle.panel-toggle--bottom:active {
    background: transparent !important;
    background-color: transparent !important;
    box-shadow: none !important;
  }
  .panel-toggle--bottom .panel-toggle-icon {
    color: #222 !important;
    font-size: 18px !important;
    font-weight: 800 !important;
    text-shadow: 0 0 5px #fff, 0 1px 3px rgba(255,255,255,1), 0 -1px 3px rgba(255,255,255,1);
  }
  .side-panel.is-collapsed .result-list,
  .side-panel.is-collapsed .result-header { display: none !important; }
  .side-panel.is-collapsed .result-section { background: transparent !important; display: none !important; }
  /* 사이드 화살표: 지도 왼쪽 중앙 (접기/펼치기 동일 위치) */
  .panel-toggle--side {
    display: none !important;
    position: absolute !important;
    left: 0 !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    z-index: 35 !important;
    width: 30px !important;
    height: 56px !important;
    border-radius: 0 12px 12px 0 !important;
    border-left: none !important;
  }
  /* 커스텀 줌 (회색 글자 없음) */
  .map-zoom {
    position: absolute !important;
    right: 12px !important;
    top: 12px !important;
    z-index: 35 !important;
    display: flex !important;
    flex-direction: column !important;
    border-radius: 8px !important;
    overflow: hidden !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18) !important;
    background: #fff !important;
  }
  .map-zoom-btn {
    width: 36px !important;
    height: 36px !important;
    border: none !important;
    background: #fff !important;
    color: #333 !important;
    font-size: 22px !important;
    font-weight: 600 !important;
    line-height: 1 !important;
    cursor: pointer !important;
    padding: 0 !important;
  }
  .map-zoom-btn + .map-zoom-btn {
    border-top: 1px solid #e5e5e5 !important;
  }
  .map-zoom-btn:active { background: #f0f0f0 !important; }
  .map-joystick {
    position: absolute !important;
    right: 12px !important;
    bottom: 12px !important;
    z-index: 40 !important;
    width: 80px !important;
    height: 80px !important;
  }
  @media (min-width: 600px) {
    .panel-toggle--side { display: flex !important; }
    .panel-toggle--bottom { display: none !important; }
    .map-joystick {
      width: 160px !important;
      height: 160px !important;
      right: 18px !important;
      bottom: 18px !important;
    }
    /* 줌 버튼 2배 */
    .map-zoom-btn {
      width: 72px !important;
      height: 72px !important;
      font-size: 36px !important;
    }
    .side-panel.is-collapsed {
      flex: 0 0 0px !important;
      max-width: 0 !important;
      min-width: 0 !important;
      width: 0 !important;
      border: none !important;
      background: transparent !important;
      overflow: visible !important;
    }
    .side-panel.is-collapsed .search-bar,
    .side-panel.is-collapsed .result-section {
      display: none !important;
    }
  }
  @media (min-width: 960px) {
    .panel-toggle--bottom { display: none !important; }
  }
</style>

<style id="arrow-area-transparent-final">
/* 화살표 탭 주변의 흰색 영역은 완전히 투명하게 */
.side-panel.is-collapsed,
.side-panel.is-collapsed .result-section,
.side-panel.is-collapsed .result-header,
.side-panel.is-collapsed .result-header-wrap,
.side-panel.is-collapsed .panel-toggle-wrap {
  background: transparent !important;
  background-color: transparent !important;
  border-color: transparent !important;
  box-shadow: none !important;
}

/* PC: 접힌 패널 자체가 흰색 띠를 만들지 않도록 */
@media (min-width: 600px) {
  .side-panel.is-collapsed {
    background: transparent !important;
    background-color: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
  }
  .side-panel.is-collapsed .result-section {
    background: transparent !important;
    background-color: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
  }
  .side-panel.is-collapsed .result-header {
    background: transparent !important;
    background-color: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
  }
  .side-panel.is-collapsed .panel-toggle--side {
    background: #fff !important;
    background-color: #fff !important;
    border: 1px solid rgba(0,0,0,.14) !important;
    border-left: 0 !important;
    border-radius: 0 12px 12px 0 !important;
    box-shadow: 1px 1px 5px rgba(0,0,0,.14) !important;
  }
}

/* 모바일: 화살표는 항상 지도 위 — 펼침/접힘 모두 양옆 지도 보임 */
@media (max-width: 599px) {
  .side-panel.is-collapsed .result-section {
    display: none !important;
  }
  button.panel-toggle.panel-toggle--bottom {
    display: flex !important;
    position: absolute !important;
    top: 2px !important;
    left: 50% !important;
    transform: translateX(-50%) !important;
    z-index: 36 !important;
    width: 44px !important;
    height: 28px !important;
    background: transparent !important;
    background-color: transparent !important;
    border: none !important;
    box-shadow: none !important;
  }
}
</style>

</head>
<body>
<div class="app">

  <!-- 왼쪽(모바일에서는 위쪽): 검색 / 결과 -->
  <div class="side-panel" id="sidePanel">

    <!-- 주소 검색 -->
    <div class="search-bar">
      <div class="search-input-wrap">
        <input id="searchInput" type="text" placeholder="주소·시장명·상호명 입력 (세종)" autocomplete="off" />
        <button id="micBtn" class="mic-btn" type="button" title="음성으로 검색" aria-label="음성으로 검색">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path fill="currentColor" d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
        <div id="suggestList" class="suggest-list" hidden></div>
      </div>
      <button id="searchBtn">검색</button>
      <button id="resetBtn" class="reset-btn">초기화</button>
    </div>

    <!-- 검색 결과 -->
    <div class="result-section" id="resultSection">
      <div class="result-header">
        <span id="resultTitle">검색 결과</span>
        <span class="result-count-badge" id="alleyCountBadge">골목형상점가 0곳</span>
      </div>
      <div class="result-list" id="resultList">
        <div class="result-empty">골목형상점가 데이터를 불러오는 중입니다…</div>
      </div>
    </div>
  </div>

  <!-- 오른쪽(모바일에서는 아래쪽): 지도 -->
  <div class="map-panel">
    <div class="map-wrap">
      <div id="map"></div>
      <!-- 모바일: 지도 상단 중앙 화살표 — ▲/▼ 모두 지도 위에 떠서 양옆이 지도로 보임 -->
      <button type="button" class="panel-toggle panel-toggle--bottom" id="panelToggleBottom" aria-expanded="true" title="목록 접기/펼치기" aria-label="목록 접기">
        <span class="panel-toggle-icon" aria-hidden="true">▲</span>
      </button>
      <!-- PC/패드: 지도 왼쪽 가장자리 중앙 화살표 -->
      <button type="button" class="panel-toggle panel-toggle--side" id="panelToggleSide" aria-expanded="true" title="목록 접기/펼치기" aria-label="목록 접기">
        <span class="panel-toggle-icon" aria-hidden="true">◀</span>
      </button>
      <!-- 커스텀 줌 (+/−) — 회색 글자 없음, PC/패드에서 2배 -->
      <div class="map-zoom" id="mapZoom" aria-label="지도 확대 축소">
        <button type="button" class="map-zoom-btn" id="zoomInBtn" title="확대" aria-label="확대">+</button>
        <button type="button" class="map-zoom-btn" id="zoomOutBtn" title="축소" aria-label="축소">−</button>
      </div>
      <!-- 지도 이동 조이스틱 -->
      <div class="map-joystick" id="mapJoystick" aria-label="지도 이동 조이스틱">
        <div class="map-joystick-base">
          <div class="map-joystick-knob" id="mapJoystickKnob"></div>
        </div>
      </div>
    </div>

    <!-- 지도를 볼 기준 (유형별 클릭 필터) -->
    <div class="view-criteria">
      <div class="vc-title">지도 표시 기준</div>
      <div class="vc-options" id="typeFilterOptions">
        <button type="button" class="type-chip active" data-type="전통시장" style="--chip-color:#f5c518">전통시장</button>
        <button type="button" class="type-chip active" data-type="상점가" style="--chip-color:#3fae5a">상점가</button>
        <button type="button" class="type-chip active" data-type="골목형상점가" style="--chip-color:#3b82f6">골목형상점가</button>
      </div>
    </div>
  </div>

</div>

<!-- 엑셀 파싱 라이브러리 (SheetJS) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- 기능 로직 v20260924c -->
<script src="app.js?v=20260926b"></script>
</body>
</html>
