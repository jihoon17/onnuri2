<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상점가 위치 검색 지도</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- 왼쪽(모바일에서는 위쪽): 검색 / 결과 -->
  <div class="side-panel">

    <!-- 주소 검색 -->
    <div class="search-bar">
      <input id="searchInput" type="text" placeholder="주소 입력" />
      <button id="micBtn" class="mic-btn" type="button" title="음성으로 검색">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path fill="currentColor" d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </button>
      <button id="searchBtn">검색</button>
      <button id="resetBtn" class="reset-btn">초기화</button>
    </div>

    <!-- 검색 결과 -->
    <div class="result-header">
      <span id="resultTitle">검색 결과</span>
      <span class="result-count-badge" id="alleyCountBadge">골목형상점가 0곳</span>
    </div>
    <div class="result-list" id="resultList">
      <div class="result-empty">골목형상점가 데이터를 불러오는 중입니다…</div>
    </div>
  </div>

  <!-- 오른쪽(모바일에서는 아래쪽): 지도 -->
  <div class="map-panel">
    <div class="map-wrap">
      <div id="map"></div>
    </div>

    <!-- 지도를 볼 기준 (색상 범례) -->
    <div class="view-criteria">
      <div class="vc-title">지도를 볼 기준</div>
      <div class="vc-options">
        <span class="vc-legend"><i class="vc-swatch" style="background:#3b6ea5"></i>구역(기본)</span>
        <span class="vc-legend"><i class="vc-swatch" style="background:#123a63"></i>선택한 구역(라벨 클릭)</span>
        <span class="vc-legend"><i class="vc-swatch" style="background:#8fd0f2"></i>선택 외 구역</span>
        <span class="vc-legend"><i class="vc-swatch" style="background:#e02424"></i>검색된 특정 주소</span>
      </div>
      <div class="vc-note">주소·지번·상점 이름으로 검색하면 검색된 주소는 빨간색으로 강조되고, 다른 구역들도 계속 파란색으로 표시됩니다. 지도 위 상점가 라벨을 클릭하면 그 구역은 진한 파란색, 나머지는 하늘색으로 구분되어 보입니다.</div>
    </div>
  </div>

</div>

<!-- 엑셀 파싱 라이브러리 (SheetJS) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- 기능 로직 -->
<script src="app.js"></script>
</body>
</html>
